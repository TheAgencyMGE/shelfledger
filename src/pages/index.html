    <div class="page-head">
      <h1>Radar</h1>
      <div class="head-actions">
        <button type="button" class="btn" data-ics disabled>Download .ics</button>
      </div>
    </div>

    <div data-radar-meta></div>

    <nav class="stages" data-stages aria-label="Release stage"></nav>

    <div class="filters" data-radar-filters></div>

    <section data-radar-list aria-label="Releases">
      <p class="muted">Loading.</p>
    </section>

    <p class="hint radar-foot">
      Matching runs in this browser against the wishlist on this device.
      <a href="about/">Where the data comes from</a>
    </p>

    <noscript>
      <p class="muted">
        The radar reads a static JSON file and filters it in the page, so it needs JavaScript.
      </p>
    </noscript>
